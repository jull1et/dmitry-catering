<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена | Catering Chefs Table</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf9f8">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<style>
@font-face{font-family:"Onest";font-weight:400 800;font-style:normal;font-display:swap;src:url(/fonts/onest-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Unbounded";font-weight:500 800;font-style:normal;font-display:swap;src:url(/fonts/unbounded-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{--bg:#fbf9f8;--ink:#241d1e;--muted:#6a6062;--line2:rgba(36,29,30,.28);--acc:#d63a25;--acc-hi:#bd2f1c;--r:14px;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;align-items:center}
main{width:100%;max-width:560px;margin:0 auto;padding:48px 20px}
.brand{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
h1{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.1;font-size:clamp(28px,8vw,40px);margin:40px 0 16px}
p{color:var(--muted);margin-bottom:28px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border-radius:var(--r);border:1px solid transparent;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:hover{background:var(--acc-hi)}
.btn-line{border-color:var(--line2);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
</style>
</head>
<body>
<main>
  <a class="brand" href="/">Catering Chefs Table</a>
  <h1>Этой страницы больше нет</h1>
  <p>Мы обновили сайт. Меню и заявка на банкет теперь на главной странице.</p>
  <div class="acts">
    <a class="btn btn-acc" href="/#menu">Открыть меню</a>
    <a class="btn btn-line" href="/">На главную</a>
  </div>
</main>
</body>
</html>
